# HiPDA for Kindle -- copy this file, fill in username / password_md5,
# and keep it on the Kindle. Never store the plaintext password here.
# Use tools/gen_config.py on a computer to generate password_md5.

forum_server=https://www.4d4y.com
image_host=https://img02.4d4y.com
username=
password_md5=

cookie_file=/mnt/us/extensions/hipda/cookies.txt
font_file=/mnt/us/extensions/hipda/fonts/reading.bin
cache_dir=/mnt/us/extensions/hipda/cache

net_cmd=curl
user_agent=Mozilla/5.0 (compatible; HiPDA-Kindle/0.9)

# 0 = derive glyph scale from the panel DPI (recommended for all models)
font_scale=0
# pages between GC16 full flashes (clears e-ink ghosting)
full_refresh_every=6
timeout=20

# empty = show the full built-in fid catalog
forums=2,6,7,59,9,60,56,22,50,24,23,25

offline=0
no_login=0
